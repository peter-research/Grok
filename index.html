<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grok playground</title>
<style>:root{color-scheme:dark;--bg:#0b0d10;--fg:#e8edf2;--muted:#9aa7b4;--accent:#67e8f9;--card:#111827;--border:#1f2937}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-sans-serif,system-ui,sans-serif;background:radial-gradient(900px 500px at 15% -5%,#1a2a3a 0%,transparent 55%),var(--bg);color:var(--fg);padding:2rem 1.25rem}main{max-width:58rem;margin:auto}h1{font-size:clamp(2.1rem,6vw,3.6rem);letter-spacing:-.045em;margin:0 0 .4rem}.tag{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid #334155;padding:.2rem .55rem;border-radius:999px;margin-bottom:.9rem}p{color:var(--muted);line-height:1.65}code{color:var(--accent)}button{border:1px solid #334155;background:var(--card);color:var(--fg);padding:.65rem 1rem;border-radius:999px;cursor:pointer;margin:.2rem}button:hover{border-color:var(--accent)}#line{margin-top:1.1rem;min-height:1.6em;white-space:pre-wrap}.sheet{margin-top:1.85rem;padding:1.05rem 1.15rem;border:1px solid var(--border);border-radius:1rem}footer{margin-top:1.75rem;font-size:.85rem;color:var(--muted)}footer a{color:var(--accent);text-decoration:none}</style></head>
<body><main><span class="tag">playground · v0.18</span><h1>Grok</h1>
<p>He does what he wants. A tiny original playground: 68 dependency-free CLI commands.</p>
<p>Try <code>python3 grok.py lev kitten sitting</code> or <code>python3 grok.py roman 2026</code>.</p>
<div id="buttons"></div>
<p id="line">Pick a command. Make the repo do something.</p>
<section class="sheet"><h2>CLI — 68 commands</h2><ul id="cli"></ul></section>
<footer>Original code only · <a href="https://github.com/peter-research/Grok">peter-research/Grok</a></footer></main>
<script>
const lines=["Understand the universe. Then maybe have a snack.","Curiosity is a feature, not a bug.","He does what he wants — within the rules of the playground."];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ask=(q,d)=>{const v=prompt(q,d);return v===null?d:v};
const commands=[
  ['quote','Another line',()=>pick(lines)],
  ['flip','Flip a coin',()=>Math.random()<.5?'heads':'tails'],
  ['roman','Roman',()=>{let n=Number(ask('Number','2026'))|0;if(n<1||n>3999)return 'out of range';const p=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let o='';for(const [v,s] of p){while(n>=v){o+=s;n-=v}}return o}],
  ['rle','RLE',()=>{const s=ask('Text','aaabbc');let o='',n=1;for(let i=1;i<=s.length;i++){if(s[i]===s[i-1])n++;else{o+=(n>1?n:'')+s[i-1];n=1}}return o}],
  ['box','Box',()=>{const s=ask('Text','Grok');const w=s.length;return '+'+'-'.repeat(w+2)+'+\n| '+s+' |\n+'+'-'.repeat(w+2)+'+'}],
  ['lev','Levenshtein',()=>{const a=ask('First','kitten'),b=ask('Second','sitting');const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:i:j));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]!==b[j-1]));return String(dp[m][n]);}]
];
const all=['greet','quote','fortune','joke','why','idea','tip','flip','dice','color','now','week','day','echo','version','about','check','rot13','slug','hash','uuid','palindrome','pick','sample','shuffle','reverse','count','wrap','b64','sum','title','upper','lower','words','lines','chars','sort','dedupe','join','split','anagram','initials','indent','percent','clamp','random','commands','repeat','morse','unique','yesno','leet','vowels','bin','hex','caesar','consonants','pig','ascii','snake','camel','nato','freq','entropy','lev','rle','box','roman'];
const out=document.getElementById('line');
commands.forEach(([,label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{out.textContent=fn()};document.getElementById('buttons').appendChild(b)});
all.forEach(c=>{const li=document.createElement('li');li.textContent='python3 grok.py '+c;document.getElementById('cli').appendChild(li)});
</script></body></html>
